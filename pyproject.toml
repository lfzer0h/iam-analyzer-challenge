[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-contextual-analyzer"
version = "0.1.0"
description = "Blast-radius–aware static analyzer for AWS IAM exports, tuned for PCI DSS payment environments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
iam-analyzer = "analyzer.cli:main"

[tool.setuptools]
packages = ["analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
